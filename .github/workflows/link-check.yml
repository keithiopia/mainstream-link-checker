name: Mainstream link checker

on:
  workflow_dispatch:

  schedule:
    - cron: '0 8 1 * *'

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - team: Red
            file: red
          - team: Blue
            file: blue
          - team: Green
            file: green
          - team: Yellow
            file: yellow
          - team: Unassigned
            file: unassigned

    steps:
      - name: Get repository files
        uses: actions/checkout@v5
        with:
          ref: reports

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run link checker
        run: ruby page_link_checker.rb ${{ matrix.team }}

      - name: Upload report
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.file }}-report
          path: |
            reports/${{ matrix.file }}-broken.csv
            reports/${{ matrix.file }}-suspect.csv
          if-no-files-found: error

  commit-reports:
    needs: check-links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v5
        with:
          ref: reports

      - name: Clear existing reports
        run: |
          mkdir -p reports
          rm -f reports/*.csv

      - name: Download generated reports
        uses: actions/download-artifact@v5
        with:
          pattern: "*-report"
          path: reports
          merge-multiple: true

      - name: Verify downloaded reports
        run: ls -lah reports

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/

          git diff --staged --quiet || git commit -m "Update link check reports"

          git push origin reports